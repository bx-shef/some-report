name: CI/CD

# Проверки на каждый PR и на main, плюс публикация образа с main. Имя джобы `ci` — то, что включается в required status checks
# правила защиты ветки: переименование молча снимет требование, поэтому имя менять нельзя.
#
# Сторонние actions запинены на полный commit SHA: изменяемый тег может быть перезаписан
# владельцем action и выполнить чужой код на раннере с GITHUB_TOKEN. Комментарий `# vX.Y.Z`
# читает Dependabot, чтобы держать SHA свежими.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Отменяем только устаревшие прогоны PR; прогон на main не прерываем.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    # Проект `nuxt` в Vitest поднимает рантайм Nuxt поверх lint/typecheck/generate.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # Версия читается из поля "packageManager" в package.json.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Nuxt
        run: pnpm exec nuxi prepare
        # Генерирует .nuxt/eslint.config.mjs и tsconfig'и, от которых зависят lint и typecheck.
        # Без этого шага оба прохода молча сужаются.

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      # Те же входы, что у образа в docker-build/deploy: смоук ниже должен смотреть на ту же
      # сборку, что уезжает в GHCR, а не на билд с пустым siteUrl.
      - name: Build (nuxt generate)
        run: pnpm generate
        env:
          NUXT_PUBLIC_SITE_URL: ${{ vars.NUXT_PUBLIC_SITE_URL }}
          NUXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}

      # ⚠ Единственная проверка, которая не может соврать про CSP: открыть собранную страницу
      # настоящим браузером под боевым заголовком. `cspHashes` и `cspVerify` зовут один разбор
      # HTML, и ошибка в нём проходит через оба зелёной — так в прод уехала заблокированная
      # импорт-карта при исправных хешах. Браузер — системный Chrome раннера, без скачивания.
      # ⚠ Осознанная связка: Chrome образа раннера не запинен, playwright-core в lock-файле — да.
      # Если шаг покраснел на всех ветках без изменений кода — это обновился Chrome раннера;
      # лечится бампом playwright-core, а не правкой смоука.
      - name: CSP smoke (browser)
        run: pnpm smoke

  docker-build:
    name: docker-build
    # Собираем боевой образ на каждом PR — БЕЗ публикации. Ловит поломку Dockerfile, базового
    # образа и гардов на артефакте до того, как они доедут до main и до выката.
    # Гоняется и на PR от Dependabot: обновление node — ровно тот случай, где это и всплывёт.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runner
          push: false
          # Образ нужен демону раннера: ниже его поднимаем и открываем браузером.
          load: true
          build-args: |
            NUXT_PUBLIC_SITE_URL=${{ vars.NUXT_PUBLIC_SITE_URL }}
            NUXT_PUBLIC_COMMIT_SHA=${{ github.sha }}
          # Кэш ТОЛЬКО на чтение. Кэш, записанный из refs/pull/N/merge, доступен лишь этому же PR,
          # но место в общем бюджете репозитория занимает — и вытеснил бы кэш main, из которого
          # эта джоба и читает. Пишет кэш только выкат с main.
          cache-from: type=gha,scope=runner
          tags: some-report:ci

      # ⚠ Смоук на ОБРАЗЕ, а не на локальной сборке. Смоук в job `ci` ловит ошибку классификации
      # скриптов за 7 с, но заголовок там собирается в памяти из nginx.conf. Только здесь виден
      # весь путь Dockerfile → envsubst → nginx -t → реальные add_header по location и
      # `error_page 405 =200` для POST от портала — то, что локальный сервер лишь имитирует.
      # На main не повторяем: тот же код уже проверен на PR, а deploy заперт за зелёным ci.
      - name: Run image
        run: |
          docker run -d --name some-report-ci -p 8080:8080 some-report:ci
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8080/ && exit 0
            sleep 1
          done
          echo 'контейнер не ответил за 30 с'
          docker logs some-report-ci
          exit 1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      # --ignore-scripts: postinstall (`nuxt prepare`) смоуку не нужен, ему хватает playwright-core.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: CSP smoke on image (browser)
        run: pnpm smoke:image http://127.0.0.1:8080

      # Лог nginx нужен ровно тогда, когда смоук упал, — печатаем всегда, он короткий.
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs some-report-ci || true
          docker rm -f some-report-ci || true

  deploy:
    name: Build & Push to GHCR
    needs: ci
    # Выкат заперт за зелёным CI: красный CI не пускает образ в GHCR, а значит и на сервер.
    # Только main — пушем или ручным workflow_dispatch (передеплой после смены переменной).
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write  # нужен для публикации в ghcr.io

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # встроенный, отдельный секрет не нужен

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      # ⚠ NUXT_PUBLIC_SITE_URL — переменная репозитория (Settings → Variables), а не секрет: это
      # публичный адрес. Но она ОБЯЗАТЕЛЬНА: без неё страница установки не сможет построить
      # абсолютный адрес обработчика и откажется регистрировать точки встройки.
      - name: Проверить, что публичный адрес задан
        run: |
          if [ -z "${{ vars.NUXT_PUBLIC_SITE_URL }}" ]; then
            echo "Не задана переменная репозитория NUXT_PUBLIC_SITE_URL — приложение нельзя будет установить в портал"
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NUXT_PUBLIC_SITE_URL=${{ vars.NUXT_PUBLIC_SITE_URL }}
            NUXT_PUBLIC_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner
