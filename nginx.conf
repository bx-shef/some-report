# nginx для статики отчёта. Раздаёт `.output/public`, собранный `nuxt generate`.
# Ни backend'а, ни проксирования: отчёт читает CRM прямо из фрейма (см. CLAUDE.md).
#
# Образ — nginxinc/nginx-unprivileged: работает не от root и слушает 8080.
# TLS терминирует внешний nginx-proxy, сюда приходит уже HTTP.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Пререндеренные маршруты лежат каталогами (`/app/index.html`). Без этого редирект
    # `/app` → `/app/` уехал бы на внутренний порт 8080 вместо публичного адреса.
    absolute_redirect off;

    # ⚠ Битрикс24 открывает обработчик плейсмента POST-запросом (см. docs/EMBEDDING.md).
    # Статике POST не положен, и nginx по умолчанию отвечает 405 — то есть виджет показывал бы
    # пустоту при совершенно рабочей сборке. Отдаём тот же файл со статусом 200.
    error_page 405 =200 $uri;

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Ассеты с хешем в имени: содержимое по этому адресу не меняется никогда.
    #
    # ⚠ У локации СВОЙ набор `add_header`, потому что nginx НЕ наследует серверные заголовки в
    # локацию, где объявлен хоть один свой. Поэтому здесь повторены и заголовки безопасности —
    # кроме CSP: она нужна документам, а не ассетам.
    location /_nuxt/ {
        # ⚠ Здесь НЕТ `expires 1y`, и это не забывчивость: директива `expires` сама печатает
        # `Cache-Control: max-age=…`, и вместе с `add_header` ниже заголовок уходил ДВАЖДЫ —
        # `max-age=31536000` и `public, immutable` отдельными строками. Замечено на живом выкате.
        # Браузеры такое переживают, но два заголовка с одним именем — это две политики кэша,
        # и какая из них применится, зависит от реализации. Пишем одну строку целиком.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=()" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ⚠ HTML кэшировать нельзя. Без этой строки nginx о кэшировании не говорит НИЧЕГО, и браузер
    # применяет эвристику — держит документ часами. В портале это выглядит как невыкаченная
    # правка: приложение обновлено, а фрейм открывает старую сборку.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=()" always;

    # ⚠ `Strict-Transport-Security` здесь НЕ ставим — его ставит тот, кто терминирует TLS
    # (внешний nginx-proxy). На живом выкате заголовок приходил ДВАЖДЫ: наш и его.
    #
    # Причина не в косметике. Этот контейнер не видит HTTPS вообще: снаружи к нему приходит
    # обычный HTTP с порта 8080, и знать, шифруется ли соединение до браузера, он не может.
    # Объявлять от его имени «этот сайт только по HTTPS на год вперёд» — значит утверждать то,
    # что ему неизвестно: подними тот же образ без TLS на стенде, и заголовок запрёт домен
    # в HTTPS у всех, кто туда зайдёт.
    #
    # ⚠ ЦЕНА этого решения: мы теряем `includeSubDomains`, который был у нашего заголовка и
    # которого нет у прокси. Сознательно и по двум причинам. Во-первых, поддоменов у
    # `some-report.<домен>` нет — директива сейчас не покрывает ничего. Во-вторых, вернуть её —
    # это одна настройка `HSTS` у nginx-proxy, то есть у того, кому заголовок и принадлежит.
    #
    # ⚠ Дубль при этом НЕ был опасен, и говорить обратное — значит преувеличивать: RFC 6797 §8.1
    # объявляет STS singleton-полем, браузер берёт первый заголовок и игнорирует остальные. Наш
    # шёл первым, то есть в силе была именно наша, более строгая политика. Убираем не потому, что
    # дубль что-то ломал, а потому, что заголовок объявлял то, чего этот контейнер не знает.

    # ⚠ `X-Frame-Options` здесь НЕТ намеренно. Отчёт по назначению живёт во фрейме портала, а этот
    # заголовок не умеет списка доменов: `DENY` убил бы приложение, `SAMEORIGIN` — тоже. Кто может
    # нас встраивать, задаёт `frame-ancestors` в CSP ниже. Ставить оба нельзя: в части браузеров
    # старый заголовок перебивает CSP, и на месте виджета снова пустая область.
    #
    # `frame-ancestors` и `connect-src` — КТО может нас встраивать и КУДА мы имеем право ходить.
    # Оба списка — одна переменная `B24_PORTAL_ORIGINS`, подставляемая при старте контейнера
    # штатным механизмом шаблонов nginx.
    #
    # Сам список — ЧАСТЬ ПРОДУКТА и живёт в `Dockerfile` (`ENV B24_PORTAL_ORIGINS`): приложение
    # хостится одним экземпляром на всех клиентов, облачные порталы покрыты wildcard'ами по зонам,
    # коробочный портал клиента (у ООО «Анкрон» это `bitrix.ankron.by`) добавляется туда одной
    # строкой и штатным выкатом. На сервере ничего не настраивается.
    #
    # ⚠ Почему тогда переменная, а не текст прямо здесь. Во-первых, одно место вместо двух
    # (`frame-ancestors` и `connect-src` обязаны совпадать). Во-вторых, запасной ход для клиента,
    # поднимающего СВОЮ копию приложения: ему достаточно переопределить окружение. Значение перед
    # подстановкой проверяет `deploy/validate-portal-origins.sh` — кавычка или `*` в нём роняют
    # контейнер, а не отдают испорченный заголовок.
    #
    # ⚠ Забытый коробочный домен даёт пустой фрейм БЕЗ ЕДИНОЙ ОШИБКИ в интерфейсе портала:
    # заголовок присылает сервер, нарушение фиксирует браузер, в логах ни строки. Диагностируется
    # это часами — мы это уже проходили с импорт-картой.
    #
    # `script-src` БЕЗ `'unsafe-inline'`: инлайновые скрипты Nuxt (в их числе
    # `window.__NUXT__.config`, чей текст меняется от сборки к сборке) разрешены поимённо —
    # sha256-хеши подставляет на сборке scripts/cspHashes.ts вместо `__CSP_SCRIPT_HASHES__`.
    # `'unsafe-inline'` снял бы защиту от XSS целиком: браузер перестал бы отличать наш скрипт от
    # вставленного через дыру.
    #
    # `style-src` `'unsafe-inline'` оставлен: Vue и b24ui печатают инлайновые атрибуты style.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' __CSP_SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ${B24_PORTAL_ORIGINS}; font-src 'self' data:; object-src 'none'; frame-src 'none'; frame-ancestors 'self' ${B24_PORTAL_ORIGINS}; base-uri 'self'; form-action 'self';" always;
}
